<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Beach Pulse</title>
    <meta name="description" content="Beach Pulse - explore your university.">  <!-- SEO -->
    <meta name="theme-color" content="#0A0B0D">
    <link rel="icon" type="image/svg+xml" href="assets/images/logos/pulse-mark.svg">  <!-- Favicon -->
    <script src="js/prefs.js"></script>  <!-- Theme and view preferences, before paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">  <!-- Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>  <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="css/basic_styles.css">  <!-- CSS -->
    <link rel="stylesheet" href="css/app.css">  <!-- App CSS -->
    <link rel="stylesheet" href="css/app-pages/events_feed.css">  <!-- Event Feed CSS -->
    <link rel="stylesheet" href="css/app-pages/event_creation.css">  <!-- Event Creation CSS -->
    <link rel="stylesheet" href="css/app-pages/map.css">  <!-- Map CSS -->
    <link rel="stylesheet" href="css/app-pages/event_page.css">  <!-- Event Page CSS -->
    <link rel="stylesheet" href="css/app-pages/profile.css">  <!-- Profile Page CSS -->
    <link rel="stylesheet" href="css/navbar.css">  <!-- Navigation Bar CSS -->
    <link rel="stylesheet" href="css/policies.css">  <!-- Policy viewer CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>  <!-- Leaflet Map JS -->
    <script defer type="module" src="js/app.js"></script>  <!-- App JS -->
</head>
<body class="app-body">
    <!-- Top Bar -->
    <header class="top-bar">
        <button id="back-button" class="icon-button back-button" aria-label="Back" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <a class="brand" href="#events" id="brand-link" aria-label="Beach Pulse home">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13h4l2.5-7 4.5 13 3-9 1.5 3H22"/></svg>
            <span class="brand-name">Beach Pulse</span>
        </a>
        <button id="settings-button" class="avatar-button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu">
            <span class="avatar-initial" id="settings-avatar"></span>
        </button>
    </header>

    <main class="app-container">
        <!-- Events Page -->
        <section id="events-page" class="app-page" aria-label="Events">
            <!-- Events injected with JavaScript -->
            <div id="event-cards-container"></div>
        </section>

        <!-- Map Page -->
        <section id="map-page" class="app-page" aria-label="Map">
            <!-- Leaflet map loads here -->
            <div id="map"></div>
            <div class="map-legend" id="map-legend" role="group" aria-label="Filter map by category"></div>
            <button id="toggle-labels-button" class="map-control-button" aria-label="Show event names" aria-pressed="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
            </button>
        </section>

        <!-- Unique Event Page -->
        <section id="event-page" class="app-page" aria-label="Event">
            <div id="event-page-container"></div>
            <div class="error" id="event-page-error"></div>
        </section>

        <!-- Unique Profile Page -->
        <section id="profile-page" class="app-page" aria-label="Profile">
            <div id="profile-page-container"></div>
            <div class="error" id="profile-page-error"></div>
        </section>
    </main>

    <!-- Settings Panel -->
    <div class="settings-menu" id="settings-menu" role="dialog" aria-label="Settings">
        <button class="menu-profile" id="go-to-profile">
            <span class="avatar-initial menu-avatar" id="menu-avatar"></span>
            <span class="menu-profile-text">
                <span class="menu-profile-name" id="menu-username"></span>
                <span class="menu-profile-sub">View profile</span>
            </span>
        </button>

        <div class="menu-divider"></div>

        <p class="menu-label">Appearance</p>
        <div class="segmented" role="radiogroup" aria-label="Theme">
            <button role="radio" data-theme-option="dark">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                Dark
            </button>
            <button role="radio" data-theme-option="light">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Light
            </button>
        </div>

        <div class="menu-switch-row" id="clear-view-row">
            <span class="menu-switch-text">
                <span class="menu-switch-title" id="clear-view-title">Clear View</span>
                <span class="menu-switch-sub" id="clear-view-sub">Larger text, higher contrast, labeled categories and less motion</span>
            </span>
            <button role="switch" class="switch" id="toggle-ui" aria-checked="false" aria-labelledby="clear-view-title" aria-describedby="clear-view-sub"><span class="switch-thumb"></span></button>
        </div>

        <div class="menu-divider"></div>

        <button class="menu-item" id="policies-button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
            Terms and policies
        </button>
        <button class="menu-item" id="logout-button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Log out
        </button>
    </div>

    <!-- Navigation Bar -->
    <nav class="navigation-bar" aria-label="Main">
        <!-- Events Button -->
        <button class="nav-button active" data-page="events-page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>
            <span>Events</span>
        </button>
        <!-- Create Event Button Injected by JS for organizers and admins only -->
        <!-- Map Button -->
        <button class="nav-button" data-page="map-page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
            <span>Map</span>
        </button>
    </nav>
</body>
</html>
