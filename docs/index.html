<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Pulse</title>
    <meta name="theme-color" content="#0A0B0D">
    <link rel="icon" type="image/svg+xml" href="assets/images/logos/pulse-mark.svg">  <!-- Favicon -->
    <script src="js/prefs.js"></script>  <!-- Theme and view preferences, before paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">  <!-- Fonts -->
    <link rel="stylesheet" href="css/basic_styles.css">  <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">  <!-- CSS -->
    <link rel="stylesheet" href="css/policies.css">  <!-- Policy viewer CSS -->
    <script defer src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>  <!-- MSAL -->
    <script defer type="module" src="js/login.js"></script>  <!-- Login JS -->
</head>
<body>
    <div class="login-page">
        <div class="login-glow" aria-hidden="true"></div>

        <!-- Cards -->
        <div class="login-wrapper">
            <!-- Login Card -->
            <div class="login-container" id="login-card">
                <div class="card-content">
                    <!-- Branding -->
                    <div class="card-branding">
                        <svg class="login-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M2 13h4l2.5-7 4.5 13 3-9 1.5 3H22"/></svg>
                        <h1 class="login-title">Beach Pulse</h1>
                        <p class="login-subtext">Everything happening at The Beach.</p>
                    </div>

                    <div class="card-actions">
                        <!-- Microsoft button -->
                        <button type="button" class="oauth-button" id="outlook-button">
                            <svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
                            Continue with Microsoft
                        </button>
                        <div class="error" id="auth-error" role="alert"></div>
                        <p class="oauth-hint">For CSULB students, faculty and staff</p>
                    </div>
                </div>
            </div>

            <!-- Signup Card -->
            <div class="login-container" id="signup-card">
                <div class="card-content">
                    <div class="card-branding">
                        <p class="login-step">Almost there</p>
                        <h1 class="login-title">Create your profile</h1>
                        <p class="login-subtext">This is how you'll appear on events you post.</p>
                    </div>

                    <!-- Avatar -->
                    <div class="avatar-picker" role="button" tabindex="0" aria-label="Choose a profile photo">
                        <div class="avatar-picker-inner">
                            <img id="avatar-preview" src="" alt="">
                        </div>
                        <input type="file" id="avatar-input" accept="image/*" hidden>
                    </div>

                    <div class="card-actions">
                        <!-- Username -->
                        <label class="sr-only" for="username-input">Username</label>
                        <input id="username-input" type="text" placeholder="Username" autocomplete="username">

                        <!-- Policy agreement -->
                        <label class="policy-agree" for="policy-checkbox">
                            <input type="checkbox" id="policy-checkbox">
                            <span>I agree to the <button type="button" class="policy-link" data-policy="terms">Terms of Service</button>, <button type="button" class="policy-link" data-policy="privacy">Privacy Policy</button> and <button type="button" class="policy-link" data-policy="user-policy">User Policy</button>.</span>
                        </label>

                        <!-- Continue button -->
                        <div class="error" id="signup-error" role="alert"></div>
                        <button class="primary-button" id="signup-submit-button">Continue</button>
                    </div>
                </div>
            </div>
        </div>

        <img class="university-brand" src="assets/images/logos/csulb_full.png" alt="California State University, Long Beach">
    </div>
</body>
</html>
